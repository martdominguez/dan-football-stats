server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoint:
    health:
      show-details: always
      show-components: always
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
