services:
  postgres-core:
    image: postgres:16
    environment:
      POSTGRES_DB: core_registry
      POSTGRES_USER: miniscore
      POSTGRES_PASSWORD: miniscore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniscore -d core_registry"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-core-data:/var/lib/postgresql/data

  postgres-stats:
    image: postgres:16
    environment:
      POSTGRES_DB: stats_db
      POSTGRES_USER: miniscore
      POSTGRES_PASSWORD: miniscore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniscore -d stats_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres-stats-data:/var/lib/postgresql/data

  mongo-live:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-live-data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
  
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    ports:
      - "8761:8761"

  core-registry-service:
    build:
      context: .
      dockerfile: core-registry-service/Dockerfile
    depends_on:
      postgres-core:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-core:5432/core_registry
      SPRING_DATASOURCE_USERNAME: miniscore
      SPRING_DATASOURCE_PASSWORD: miniscore
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    expose:
      - "8080"

  live-engine-service:
    build:
      context: .
      dockerfile: live-engine-service/Dockerfile
    depends_on:
      - mongo-live
      - rabbitmq
    environment:
      SPRING_MONGODB_URI: mongodb://mongo-live:27017/live_engine
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    expose:
      - "8080"

  stats-service:
    build:
      context: .
      dockerfile: stats-service/Dockerfile
    depends_on:
      postgres-stats:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-stats:5432/stats_db
      SPRING_DATASOURCE_USERNAME: miniscore
      SPRING_DATASOURCE_PASSWORD: miniscore
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    expose:
      - "8080"
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - discovery-server
      - core-registry-service
      - live-engine-service
      - stats-service
    environment:
      - CORE_REGISTRY_BASE_URL=http://core-registry-service:8080
      - LIVE_ENGINE_BASE_URL=http://live-engine-service:8080
      - STATS_BASE_URL=http://stats-service:8080
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - discovery-server
      - core-registry-service
      - live-engine-service
      - stats-service
      - api-gateway
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.0.2
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-core-data:
  postgres-stats-data:
  mongo-live-data:
  prometheus-data:
  grafana-data:
