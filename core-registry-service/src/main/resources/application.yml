server:
  port: 8080

spring:
  application:
    name: core-registry-service
  datasource:
    url: jdbc:postgresql://localhost:5432/core_registry
    username: miniscore
    password: miniscore
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  include-application-name: false
  pattern:
    # Dejamos visible service name + traceId + spanId para correlacionar logs con Tempo y Loki.
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

management:
  tracing:
    # En local sampleamos todo para que cada request de la demo aparezca en Tempo.
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    resource-attributes:
      service.name: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      show-components: always
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
